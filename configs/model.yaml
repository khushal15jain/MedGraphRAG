# Model configuration — kept to models validated for 8GB unified memory.

embedding:
  model_name: BAAI/bge-base-en-v1.5
  device: cpu
  max_seq_length: 512
  normalize_embeddings: true
  batch_size: 16          # kept small deliberately for 8GB RAM safety

reranker:
  model_name: BAAI/bge-reranker-base
  device: cpu
  batch_size: 8
  top_k: 7                 # number of chunks kept after reranking

ner:
  spacy_model: en_core_sci_sm
  linker_threshold: 0.85

llm:
  provider: ollama
  model_name: llama3.2:latest
  host: http://localhost:11434
  temperature: 0.0
  max_tokens: 768
  top_p: 0.9
  request_timeout_s: 120
