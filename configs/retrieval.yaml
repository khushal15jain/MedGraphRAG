# Chunking + retrieval hyperparameters.

chunking:
  chunk_size: 500
  chunk_overlap: 100

retrieval:
  top_k_dense: 20
  top_k_bm25: 20
  top_k_graph: 10
  hybrid_alpha: 0.35
  hybrid_beta: 0.30
  hybrid_gamma: 0.35
  graph_expansion_hops: 1
  final_top_k: 5                # top gold evidence chunks passed to generator

evaluation:
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
  hallucination_threshold: 0.7
