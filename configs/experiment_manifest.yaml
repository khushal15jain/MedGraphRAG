# MedGraphRAG Experiment Manifest
# Central machine-readable record of canonical experimental parameters.

experiment_name: MedGraphRAG_Publication_Benchmark
dataset: data/qa_dataset.json
dataset_size: 200
ablation_size_per_condition: 100
total_ablation_evaluations: 500
seed: 42

generator:
  provider: ollama
  model_name: llama3.2:latest
  quantization: 4-bit (q4_K_M)
  parameters: 3.8B
  temperature: 0.0
  top_p: 0.9

embedding_model:
  name: BAAI/bge-base-en-v1.5
  dimensions: 768
  max_seq_length: 512

reranker:
  name: BAAI/bge-reranker-base
  batch_size: 8
  jaccard_dedup_threshold: 0.65
  final_top_k: 5

chunking:
  chunk_size: 500
  chunk_overlap: 100

retrieval:
  top_k_dense: 20
  top_k_bm25: 20
  top_k_graph: 10
  hybrid_fusion_weights:
    alpha_dense: 0.35
    beta_bm25: 0.30
    gamma_graph: 0.35

graph_scoring:
  formula: "score = 1.0 / (1.0 + hop_distance)"
  normalization: pure_topological_decay

grounding:
  hybrid_claim_checker: "0.4 * lexical_overlap + 0.6 * cosine_embedding_sim"
  grounding_threshold: 0.70
  refusal_threshold: 0.35

statistical_testing:
  quality_metrics_test: paired_two_sided_wilcoxon
  latency_test: paired_ttest
  multiple_comparison_correction: holm_bonferroni
