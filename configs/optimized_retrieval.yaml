# Optimized Retrieval & Pipeline Hyperparameters (Tuned on Validation Split N_val=20)

retrieval:
  dense_weight: 0.40
  bm25_weight: 0.30
  graph_weight: 0.30
  candidate_pool_size: 40
  final_top_k: 5
  section_aware_filtering: true

reranker:
  model_name: "BAAI/bge-reranker-base"
  dedup_threshold: 0.65
  min_word_count: 15
  reranker_threshold: -2.0

graph:
  ief_scaling: true
  max_hop_distance: 2
  stop_entities:
    - "patient"
    - "patients"
    - "treatment"
    - "therapy"
    - "disease"
    - "study"
    - "cancer"
    - "clinical"
    - "data"
    - "results"

grounding:
  grounded_threshold: 0.65
  low_confidence_threshold: 0.45
  grounding_threshold: 0.65
  nli_threshold: 0.45
  drop_unsupported: true
  intent_aware_generation: true
