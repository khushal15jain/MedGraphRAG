[project]
name = "medgraphrag"
version = "0.1.0"
description = "Graph-Augmented Retrieval-Augmented Generation for Oncology Clinical Decision Support"
authors = [{ name = "MedGraphRAG Research Team" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=. --cov-report=term-missing"
